name: Patch original CV PDF

on:
  push:
    branches:
      - feature/add-yoru-to-cv
    paths:
      - .github/workflows/pdf-inspect.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pymupdf

      - name: Add YORU KR-7 to original CV without redesigning it
        shell: bash
        run: |
          git show origin/main:assets/cv/angel-sampayo-cv.pdf > /tmp/original-cv.pdf
          python - <<'PY'
          import fitz

          src = "/tmp/original-cv.pdf"
          out = "assets/cv/angel-sampayo-cv.pdf"
          demo = "https://vscodescaa.github.io/yoru-kr7/"

          doc = fitz.open(src)
          page = doc[0]

          # The original CV has a black portfolio panel in the lower-left.
          # Use its existing negative-space area, leaving every original
          # element untouched and adding only this compact project callout.
          white = (1, 1, 1)
          muted = (0.72, 0.74, 0.76)
          accent = (0.72, 0.82, 0.95)

          page.insert_text(
              (34, 674),
              "YORU KR-7",
              fontsize=8.5,
              fontname="hebo",
              color=white,
              overlay=True,
          )
          page.insert_text(
              (34, 687),
              "Interactive WebGL automotive experience",
              fontsize=5.2,
              fontname="helv",
              color=muted,
              overlay=True,
          )
          page.insert_text(
              (34, 699),
              "Three.js / WebGL / GSAP / Vite",
              fontsize=5.5,
              fontname="helv",
              color=white,
              overlay=True,
          )
          page.insert_text(
              (34, 712),
              "View interactive demo ->",
              fontsize=5.3,
              fontname="hebo",
              color=accent,
              overlay=True,
          )

          page.insert_link({
              "kind": fitz.LINK_URI,
              "from": fitz.Rect(32, 703, 111, 717),
              "uri": demo,
          })

          doc.set_metadata({
              **doc.metadata,
              "modDate": "",
          })
          doc.save(out, garbage=4, deflate=True)
          doc.close()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: corrected-cv-preview
          path: assets/cv/angel-sampayo-cv.pdf
          if-no-files-found: error

      - name: Commit corrected PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cv/angel-sampayo-cv.pdf
          git commit -m "fix: preserve original CV and add YORU KR-7 [skip ci]"
          git push origin HEAD:feature/add-yoru-to-cv
